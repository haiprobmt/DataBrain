# Local development: PostgreSQL only by default.
#   docker compose up -d db          → database for `npm run dev`
#   docker compose --profile app up  → database + the app in a container
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: databrain
      POSTGRES_PASSWORD: databrain
      POSTGRES_DB: databrain
    ports:
      - "5432:5432"
    volumes:
      - databrain-db:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U databrain"]
      interval: 5s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgres://databrain:databrain@db:5432/databrain
      DATABRAIN_DEMO_MODE: "true"
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-value}
      STORAGE_LOCAL_DIR: /app/.data/storage
    ports:
      - "3000:3000"
    volumes:
      - databrain-storage:/app/.data/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  databrain-db:
  databrain-storage:
