name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: databrain
          POSTGRES_PASSWORD: databrain
          POSTGRES_DB: databrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U databrain" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://databrain:databrain@localhost:5432/databrain_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --trace off
